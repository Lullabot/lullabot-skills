name: Skill best-practice review

# Advisory local output only. The sole comment writer is the trusted
# skill-review-report.yml workflow; this PR run receives no model key/write token.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: skill-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Advisory mechanical authoring review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Review full public bundle
        run: node scripts/review-skill.js
